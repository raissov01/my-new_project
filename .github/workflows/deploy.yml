name: Deploy To VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Deploy Scope
    runs-on: ubuntu-latest
    outputs:
      skip_deploy: ${{ steps.detect.outputs.skip_deploy }}
      deploy_frontend: ${{ steps.detect.outputs.deploy_frontend }}
      deploy_backend: ${{ steps.detect.outputs.deploy_backend }}
      deploy_nginx: ${{ steps.detect.outputs.deploy_nginx }}
      apply_stack: ${{ steps.detect.outputs.apply_stack }}
      run_migrations: ${{ steps.detect.outputs.run_migrations }}
      safe_fallback_full_deploy: ${{ steps.detect.outputs.safe_fallback_full_deploy }}
      changed_files_b64: ${{ steps.detect.outputs.changed_files_b64 }}
      summary_b64: ${{ steps.detect.outputs.summary_b64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed runtime areas
        id: detect
        run: |
          chmod +x scripts/detect-smart-deploy.sh
          bash scripts/detect-smart-deploy.sh \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish deploy summary
        run: |
          {
            echo "## Smart Deploy Decision"
            echo
            echo '```text'
            printf '%s' '${{ steps.detect.outputs.summary_b64 }}' | base64 -d
            echo
            echo '```'
            echo
            echo "### Changed Files"
            if [ -n '${{ steps.detect.outputs.changed_files_b64 }}' ]; then
              printf '%s' '${{ steps.detect.outputs.changed_files_b64 }}' | base64 -d | sed 's/^/- /'
            else
              echo "- none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (Smart Swarm)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.skip_deploy != 'true'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 209.38.247.103
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 60m
          script: |
            set -euo pipefail

            export DEPLOY_FRONTEND='${{ needs.detect.outputs.deploy_frontend }}'
            export DEPLOY_BACKEND='${{ needs.detect.outputs.deploy_backend }}'
            export DEPLOY_NGINX='${{ needs.detect.outputs.deploy_nginx }}'
            export APPLY_STACK='${{ needs.detect.outputs.apply_stack }}'
            export RUN_MIGRATIONS='${{ needs.detect.outputs.run_migrations }}'
            export CHANGED_FILES_B64='${{ needs.detect.outputs.changed_files_b64 }}'
            export DEPLOY_SUMMARY_B64='${{ needs.detect.outputs.summary_b64 }}'

            cd /opt/studywithraissov

            BACKEND_ENV_BACKUP="$(mktemp /tmp/studywithraissov-backend-env.XXXXXX)"
            FRONTEND_ENV_BACKUP="$(mktemp /tmp/studywithraissov-frontend-env.XXXXXX)"

            cp backend/.env "$BACKEND_ENV_BACKUP" 2>/dev/null || true
            cp frontend/.env "$FRONTEND_ENV_BACKUP" 2>/dev/null || true

            git fetch origin main
            git reset --hard origin/main

            cp "$BACKEND_ENV_BACKUP" backend/.env 2>/dev/null || true
            cp "$FRONTEND_ENV_BACKUP" frontend/.env 2>/dev/null || true
            rm -f "$BACKEND_ENV_BACKUP" "$FRONTEND_ENV_BACKUP"

            chmod +x docker/smart-deploy.sh
            bash docker/smart-deploy.sh
