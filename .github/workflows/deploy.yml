name: Deploy To VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (Swarm)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 209.38.247.103
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            cd /opt/studywithraissov

            # Preserve env files
            cp backend/.env /tmp/backend.env.bak 2>/dev/null || true
            cp frontend/.env /tmp/frontend.env.bak 2>/dev/null || true

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Restore env files
            cp /tmp/backend.env.bak backend/.env 2>/dev/null || true
            cp /tmp/frontend.env.bak frontend/.env 2>/dev/null || true

            # Initialize swarm if not already
            docker swarm init 2>/dev/null || true

            # Create secrets if they don't exist
            if ! docker secret inspect postgres_password >/dev/null 2>&1; then
              echo "changeme" | docker secret create postgres_password -
            fi

            # Export runtime/build variables from preserved env files
            set -a
            . frontend/.env
            . backend/.env
            STACK_DEPLOY_VERSION="$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)"
            export STACK_DEPLOY_VERSION
            set +a

            if docker buildx version >/dev/null 2>&1; then
              mkdir -p /opt/studywithraissov/.buildx-cache/backend-new
              mkdir -p /opt/studywithraissov/.buildx-cache/frontend-new
              docker buildx create --name swr-builder --use 2>/dev/null || docker buildx use swr-builder

              docker buildx build \
                --load \
                --cache-from type=local,src=/opt/studywithraissov/.buildx-cache/backend \
                --cache-to type=local,dest=/opt/studywithraissov/.buildx-cache/backend-new,mode=max \
                -t swr-backend \
                -f docker/backend.Dockerfile \
                backend/
              docker buildx build \
                --load \
                --cache-from type=local,src=/opt/studywithraissov/.buildx-cache/frontend \
                --cache-to type=local,dest=/opt/studywithraissov/.buildx-cache/frontend-new,mode=max \
                --build-arg NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL}" \
                --build-arg NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}" \
                -t swr-frontend \
                -f docker/frontend.Dockerfile \
                frontend/

              rm -rf /opt/studywithraissov/.buildx-cache/backend
              rm -rf /opt/studywithraissov/.buildx-cache/frontend
              mv /opt/studywithraissov/.buildx-cache/backend-new /opt/studywithraissov/.buildx-cache/backend
              mv /opt/studywithraissov/.buildx-cache/frontend-new /opt/studywithraissov/.buildx-cache/frontend
            else
              echo "docker buildx not found; falling back to DOCKER_BUILDKIT=1 docker build"
              DOCKER_BUILDKIT=1 docker build -t swr-backend -f docker/backend.Dockerfile backend/
              DOCKER_BUILDKIT=1 docker build \
                --build-arg NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL}" \
                --build-arg NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}" \
                -t swr-frontend \
                -f docker/frontend.Dockerfile \
                frontend/
            fi

            # Deploy/update the swarm stack with exported variables
            docker stack deploy -c docker/stack.yml swr

            # Clean up old images
            docker image prune -f

            # Wait for services to settle
            sleep 15

            echo ""
            echo "=== Stack services ==="
            docker stack services swr

            echo ""
            echo "=== Service tasks ==="
            docker stack ps swr --no-trunc | head -20

            echo ""
            echo "=== Health checks ==="
            curl -sf https://studywithraissov.com/health >/dev/null && echo " [backend OK]" || echo " [backend FAIL]"
            curl -sf -o /dev/null https://studywithraissov.com && echo " [site OK]" || echo " [site FAIL]"
