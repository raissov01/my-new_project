name: Deploy To VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Deploy Scope
    runs-on: ubuntu-latest
    outputs:
      skip_deploy: ${{ steps.detect.outputs.skip_deploy }}
      deploy_frontend: ${{ steps.detect.outputs.deploy_frontend }}
      deploy_backend: ${{ steps.detect.outputs.deploy_backend }}
      deploy_nginx: ${{ steps.detect.outputs.deploy_nginx }}
      apply_stack: ${{ steps.detect.outputs.apply_stack }}
      run_migrations: ${{ steps.detect.outputs.run_migrations }}
      safe_fallback_full_deploy: ${{ steps.detect.outputs.safe_fallback_full_deploy }}
      changed_files_b64: ${{ steps.detect.outputs.changed_files_b64 }}
      summary_b64: ${{ steps.detect.outputs.summary_b64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed runtime areas
        id: detect
        run: |
          chmod +x scripts/detect-smart-deploy.sh
          bash scripts/detect-smart-deploy.sh \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish deploy summary
        run: |
          {
            echo "## Smart Deploy Decision"
            echo
            echo '```text'
            printf '%s' '${{ steps.detect.outputs.summary_b64 }}' | base64 -d
            echo
            echo '```'
            echo
            echo "### Changed Files"
            if [ -n '${{ steps.detect.outputs.changed_files_b64 }}' ]; then
              printf '%s' '${{ steps.detect.outputs.changed_files_b64 }}' | base64 -d | sed 's/^/- /'
            else
              echo "- none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Images (GHA runner)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.skip_deploy != 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.backend.outputs.image }}
      frontend_image: ${{ steps.frontend.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        if: needs.detect.outputs.deploy_backend == 'true' || needs.detect.outputs.apply_stack == 'true'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/swr-backend:${{ github.sha }}"
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha,scope=backend \
            --cache-to   type=gha,scope=backend,mode=max \
            --provenance=false \
            -t "$IMAGE" \
            -f docker/backend.Dockerfile \
            --push \
            backend/
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        id: frontend
        if: needs.detect.outputs.deploy_frontend == 'true' || needs.detect.outputs.apply_stack == 'true'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/swr-frontend:${{ github.sha }}"
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha,scope=frontend \
            --cache-to   type=gha,scope=frontend,mode=max \
            --provenance=false \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL || 'https://studywithraissov.com' }}" \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL || '/api/v1' }}" \
            -t "$IMAGE" \
            -f docker/frontend.Dockerfile \
            --push \
            frontend/
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (Smart Swarm)
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: needs.detect.outputs.skip_deploy != 'true'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 209.38.247.103
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          # envs passes these as environment variables into the remote shell
          envs: DEPLOY_FRONTEND,DEPLOY_BACKEND,DEPLOY_NGINX,APPLY_STACK,RUN_MIGRATIONS,CHANGED_FILES_B64,DEPLOY_SUMMARY_B64,PREBUILT_BACKEND_IMAGE,PREBUILT_FRONTEND_IMAGE,GHCR_ACTOR,GHCR_TOKEN,RESEND_API_KEY,RESEND_FROM
          script: |
            set -euo pipefail

            cd /opt/studywithraissov

            BACKEND_ENV_BACKUP="$(mktemp /tmp/studywithraissov-backend-env.XXXXXX)"
            FRONTEND_ENV_BACKUP="$(mktemp /tmp/studywithraissov-frontend-env.XXXXXX)"

            cp backend/.env "$BACKEND_ENV_BACKUP" 2>/dev/null || true
            cp frontend/.env "$FRONTEND_ENV_BACKUP" 2>/dev/null || true

            git fetch origin main
            git reset --hard origin/main

            cp "$BACKEND_ENV_BACKUP" backend/.env 2>/dev/null || true
            cp "$FRONTEND_ENV_BACKUP" frontend/.env 2>/dev/null || true
            rm -f "$BACKEND_ENV_BACKUP" "$FRONTEND_ENV_BACKUP"

            # Log in to GHCR so VPS can pull the pre-built images
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            chmod +x docker/smart-deploy.sh
            bash docker/smart-deploy.sh
        env:
          DEPLOY_FRONTEND: ${{ needs.detect.outputs.deploy_frontend }}
          DEPLOY_BACKEND: ${{ needs.detect.outputs.deploy_backend }}
          DEPLOY_NGINX: ${{ needs.detect.outputs.deploy_nginx }}
          APPLY_STACK: ${{ needs.detect.outputs.apply_stack }}
          RUN_MIGRATIONS: ${{ needs.detect.outputs.run_migrations }}
          CHANGED_FILES_B64: ${{ needs.detect.outputs.changed_files_b64 }}
          DEPLOY_SUMMARY_B64: ${{ needs.detect.outputs.summary_b64 }}
          PREBUILT_BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          PREBUILT_FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Resend email — passed through to docker stack deploy for stack.yml variable substitution.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
