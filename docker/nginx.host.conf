# StudyWithRaissov — Nginx reverse proxy (DigitalOcean VPS)
#
# Install: sudo cp docker/nginx.host.conf /etc/nginx/sites-available/studywithraissov
#          sudo ln -sf /etc/nginx/sites-available/studywithraissov /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name www.studywithraissov.com;

    return 301 http://studywithraissov.com$request_uri;
}

server {
    listen 80;
    server_name studywithraissov.com;

    client_max_body_size 25M;
    set $nextjs_upstream http://127.0.0.1:3000;
    set $gobackend_upstream http://127.0.0.1:5000;

    location = /health {
        proxy_pass $gobackend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static assets from Next.js standalone (served directly by Nginx for speed)
    location /_next/static/ {
        alias /opt/studywithraissov/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /public/ {
        alias /opt/studywithraissov/public/;
        expires 30d;
        access_log off;
    }

    # Go backend API
    location /api/v1/ {
        proxy_pass $gobackend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js app (everything else)
    location / {
        proxy_pass $nextjs_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
