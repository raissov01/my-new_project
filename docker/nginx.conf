# Canonicalize www → apex on HTTP
server {
    listen 80;
    server_name www.studywithraissov.com;
    return 301 https://studywithraissov.com$request_uri;
}

# HTTP → HTTPS redirect for apex (production)
server {
    listen 80;
    server_name studywithraissov.com;
    return 301 https://$host$request_uri;
}

# Local development — HTTP only (no SSL needed)
server {
    listen 80 default_server;
    server_name localhost _;

    client_max_body_size 25M;

    location = /health {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /audio/ {
        alias /usr/share/nginx/audio/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
    }

    location /api/v1/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade — used by /api/v1/admin/live-ws and the
        # existing /api/v1/live/:code/ws live-quiz endpoint.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# Canonicalize www → apex on HTTPS
server {
    listen 443 ssl;
    server_name www.studywithraissov.com;

    ssl_certificate /etc/letsencrypt/live/studywithraissov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studywithraissov.com/privkey.pem;

    return 301 https://studywithraissov.com$request_uri;
}

# HTTPS app
server {
    listen 443 ssl;
    server_name studywithraissov.com;

    ssl_certificate /etc/letsencrypt/live/studywithraissov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studywithraissov.com/privkey.pem;

    client_max_body_size 25M;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Audio files — served directly by nginx for performance
    location /audio/ {
        alias /usr/share/nginx/audio/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
    }

    # PDF/file serving — allow embedding in iframe from same origin
    location /api/v1/files/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Pass through backend's Content-Type (application/pdf)
        proxy_pass_header Content-Type;
        proxy_pass_header Content-Disposition;

        # Override security headers for iframe embedding
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Go backend health check
    location = /health {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Go backend API
    location /api/v1/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade — used by /api/v1/admin/live-ws and the
        # existing /api/v1/live/:code/ws live-quiz endpoint.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Next.js AI routes can legitimately take longer than standard page requests.
    location /api/ai/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Next.js — RSC streaming requires buffering off and generous timeouts
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# ── bagdar.studywithraissov.com ───────────────────────────────────────────────
# Bagdar Mini App: бот пен API хостта systemd-мен жүреді (bagdar / bagdar-api),
# API 172.18.0.1:8095 тыңдайды. 80/443 осы swarm nginx-те болғандықтан,
# хосттағы портқа "host-gateway" арқылы шығамыз (ол stack.yml-дегі
# nginx сервисінің extra_hosts-ында docker_gwbridge шлюзіне байланған).
server {
    listen 80;
    server_name bagdar.studywithraissov.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bagdar.studywithraissov.com;

    ssl_certificate     /etc/letsencrypt/live/bagdar.studywithraissov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bagdar.studywithraissov.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://host-gateway:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
