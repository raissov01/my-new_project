upstream nextjs {
    server frontend:3000;
    keepalive 64;
}

upstream gobackend {
    server backend:5000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name studywithraissov.com www.studywithraissov.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name studywithraissov.com www.studywithraissov.com;

    ssl_certificate /etc/letsencrypt/live/studywithraissov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studywithraissov.com/privkey.pem;

    client_max_body_size 25M;

    # Go backend API
    location /api/v1/ {
        proxy_pass http://gobackend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
