resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

# Canonicalize www → apex on HTTP
server {
    listen 80;
    server_name www.studywithraissov.com;
    return 301 https://studywithraissov.com$request_uri;
}

# HTTP → HTTPS redirect for apex
server {
    listen 80;
    server_name studywithraissov.com;
    return 301 https://$host$request_uri;
}

# Canonicalize www → apex on HTTPS
server {
    listen 443 ssl;
    server_name www.studywithraissov.com;

    ssl_certificate /etc/letsencrypt/live/studywithraissov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studywithraissov.com/privkey.pem;

    return 301 https://studywithraissov.com$request_uri;
}

# HTTPS app
server {
    listen 443 ssl;
    server_name studywithraissov.com;

    ssl_certificate /etc/letsencrypt/live/studywithraissov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studywithraissov.com/privkey.pem;

    client_max_body_size 25M;
    set $nextjs_upstream http://frontend:3000;
    set $gobackend_upstream http://backend:5000;

    # Go backend health check
    location = /health {
        proxy_pass $gobackend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Go backend API
    location /api/v1/ {
        proxy_pass $gobackend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js
    location / {
        proxy_pass $nextjs_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
