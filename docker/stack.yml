# StudyWithRaissov — Docker Swarm Stack
#
# Initialize swarm (one-time):
#   docker swarm init
#
# Create secrets (one-time):
#   echo "changeme" | docker secret create postgres_password -
#
# Deploy:
#   docker stack deploy -c docker/stack.yml swr
#
# Update after code change:
#   docker build -t swr-backend backend/ -f docker/backend.Dockerfile
#   docker build -t swr-frontend frontend/ -f docker/frontend.Dockerfile
#   docker stack deploy -c docker/stack.yml swr
#
# Check status:
#   docker stack services swr
#   docker service logs swr_backend

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studywithraissov
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: studywithraissov
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      replicas: 1
      labels:
        com.studywithraissov.deploy-version: ${POSTGRES_DEPLOY_VERSION:-postgres-stable}
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studywithraissov"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-swr-backend:latest}
    environment:
      PORT: ${PORT:-5000}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://studywithraissov.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://studywithraissov.com}
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-https://studywithraissov.com/api/v1/auth/google/callback}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-onboarding@resend.dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MODEL_MINI: ${OPENAI_MODEL_MINI:-gpt-4.1}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_FALLBACK_MODEL: ${CLAUDE_FALLBACK_MODEL:-}
      CLAUDE_API_URL: ${CLAUDE_API_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      LEMONSQUEEZY_CHECKOUT_URL: ${LEMONSQUEEZY_CHECKOUT_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - /opt/studywithraissov/backend/telegram-media:/app/telegram-media:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
      replicas: 2
      labels:
        com.studywithraissov.deploy-version: ${BACKEND_DEPLOY_VERSION:-backend-stable}
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    image: ${FRONTEND_IMAGE:-swr-frontend:latest}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BACKEND_URL: ${BACKEND_URL:-http://backend:5000}
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN}
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      replicas: 2
      labels:
        com.studywithraissov.deploy-version: ${FRONTEND_DEPLOY_VERSION:-frontend-stable}
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    # Publish ports in host mode (not the default ingress mesh) so the real
    # client IP reaches nginx. With ingress mode, Swarm SNATs traffic through
    # the 10.0.0.0/24 overlay and every request looks like it came from
    # 10.0.0.2 — which collapses the per-IP rate limiter onto one bucket and
    # makes X-Forwarded-For useless. Single-replica nginx (manager-only) makes
    # host mode safe.
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/studywithraissov/frontend/public/audio:/usr/share/nginx/audio:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
      replicas: 1
      labels:
        com.studywithraissov.deploy-version: ${NGINX_DEPLOY_VERSION:-nginx-stable}
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  internal:
    driver: overlay

volumes:
  pgdata:
    driver: local

secrets:
  postgres_password:
    external: true

configs:
  nginx_conf:
    name: swr_nginx_conf_${NGINX_CONFIG_VERSION:-nginx-stable}
    file: ./nginx.conf
