# StudyWithRaissov — Docker Compose (PostgreSQL + Go + Next.js + Nginx)
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#
# Env files:
#   backend/.env  — AI keys, JWT_SECRET, CORS, BACKEND_INTERNAL_TOKEN
#   frontend/.env — BACKEND_URL, BACKEND_INTERNAL_TOKEN, NEXT_PUBLIC_APP_URL
#
# DATABASE_URL is set here (not in .env) so it always points to the postgres container.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studywithraissov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: studywithraissov
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studywithraissov"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ../backend/.env
    environment:
      PORT: 5000
      ENVIRONMENT: production
      # This overrides whatever DATABASE_URL is in backend/.env
      DATABASE_URL: postgres://studywithraissov:${POSTGRES_PASSWORD:-changeme}@postgres:5432/studywithraissov?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://studywithraissov.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    env_file:
      - ../frontend/.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  pgdata:
